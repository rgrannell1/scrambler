name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # ryugraph 25.9.2 ships a manylinux wheel only for cp312 (no cp313/cp314 Linux
          # wheels), so 3.12 is the one Python that installs from a binary wheel on Linux.
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest
